<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Stackbar app icon, the source for Packaging/Assets.xcassets/AppIcon.appiconset and Packaging/AppIcon.icns. Re-render the PNGs at 16 to 1024 px after editing. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2A2F45"/>
      <stop offset="1" stop-color="#11131E"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FF7A3D"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6FA8"/>
      <stop offset="1" stop-color="#C548E8"/>
    </linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FD0FF"/>
      <stop offset="1" stop-color="#5B6CFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="barShadow" x="-20%" y="-60%" width="140%" height="220%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>
  <!-- A menu bar strip along the top of the tile -->
  <rect x="100" y="100" width="824" height="110" rx="0" fill="#FFFFFF" fill-opacity="0.06" clip-path="inset(0 round 186px 186px 0 0)"/>
  <circle cx="742" cy="155" r="14" fill="#FFFFFF" fill-opacity="0.55"/>
  <circle cx="792" cy="155" r="14" fill="#FFFFFF" fill-opacity="0.35"/>
  <circle cx="692" cy="155" r="14" fill="#FFB547"/>
  <!-- The stack: three app cards dropping out of the bar -->
  <g filter="url(#barShadow)">
    <rect x="232" y="640" width="560" height="140" rx="44" fill="url(#b3)"/>
  </g>
  <g filter="url(#barShadow)">
    <rect x="262" y="480" width="500" height="140" rx="44" fill="url(#b2)"/>
  </g>
  <g filter="url(#barShadow)">
    <rect x="292" y="320" width="440" height="140" rx="44" fill="url(#b1)"/>
  </g>
  <rect x="332" y="370" width="150" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="302" y="530" width="210" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.8"/>
  <rect x="272" y="690" width="270" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.75"/>
</svg>

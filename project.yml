# XcodeGen spec for the signed app with its widget extension:
#   brew install xcodegen && xcodegen generate && open Fluid.xcodeproj
# scripts/bundle.sh builds the app without the widget and needs no Xcode
# project. The widget needs this project because WidgetKit extensions must be
# embedded in an app bundle, which SwiftPM can't produce.
name: Fluid
options:
  bundleIdPrefix: dev.fluid
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 59J9RQXYYP
    CODE_SIGN_STYLE: Automatic
packages:
  Fluid:
    path: .
targets:
  Fluid:
    type: application
    platform: macOS
    sources:
      - Sources/Fluid
      - Packaging/Assets.xcassets
    dependencies:
      - package: Fluid
        product: FluidHostCore
      - package: Fluid
        product: FluidUI
      - target: FluidWidget
        embed: true
    info:
      path: Packaging/Info.generated.plist
      properties:
        NSCalendarsFullAccessUsageDescription: Plugins you approve for calendar access show your upcoming events and meeting links.
        NSCalendarsUsageDescription: Plugins you approve for calendar access show your upcoming events and meeting links.
        CFBundleShortVersionString: "0.9.0"
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
    # Not sandboxed: the host runs the Swift toolchain and launches plugin helpers, each in its own sandbox.
    entitlements:
      path: Packaging/Fluid.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.application-groups: [group.dev.fluid]
        # The hardened runtime denies calendar access, without a prompt,
        # unless the app carries this entitlement (Up Next needs it).
        com.apple.security.personal-information.calendars: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.fluid.app
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Without its own scheme, `-scheme Fluid` resolves to the package's Fluid executable.
    scheme: {}
  FluidWidget:
    type: app-extension
    platform: macOS
    sources: [Widget]
    dependencies:
      - package: Fluid
        product: FluidHostCore
      - package: Fluid
        product: FluidUI
    info:
      path: Packaging/Widget-Info.generated.plist
      properties:
        CFBundleShortVersionString: "0.9.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Packaging/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [group.dev.fluid]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.fluid.app.widget

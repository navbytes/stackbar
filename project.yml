# XcodeGen spec for the signed app with its widget extension:
#   brew install xcodegen && xcodegen generate && open Stackbar.xcodeproj
# scripts/bundle.sh builds the app without the widget and needs no Xcode
# project. The widget needs this project because WidgetKit extensions must be
# embedded in an app bundle, which SwiftPM can't produce.
name: Stackbar
options:
  bundleIdPrefix: io.navbytes.stackbar
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 59J9RQXYYP
    CODE_SIGN_STYLE: Automatic
packages:
  Stackbar:
    path: .
  # The release app only: Package.swift and the plugins never see these.
  # Pinned by commit, so a moved tag can't change what we build; each
  # package's binary target is checked against the SHA-256 in its own
  # Package.swift. Before bumping, check the repository is the project's own
  # (sparkle-project.org and docs.sentry.io link to it), take the commit the
  # release tag points to, and see docs/dependencies.md.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    revision: ab7d71291238df6e0492143b120c9b696a35f603 # 2.10.1
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    revision: 2f64c77f77514acd01780d1aac86ae75b7fccd04 # 9.31.0
targets:
  Stackbar:
    type: application
    platform: macOS
    sources:
      - Sources/Stackbar
      - Packaging/Assets.xcassets
    dependencies:
      - package: Stackbar
        product: StackbarHostCore
      - package: Stackbar
        product: StackbarUI
      - package: Sparkle
      - package: Sentry
      - target: StackbarWidget
        embed: true
    info:
      path: Packaging/Info.generated.plist
      properties:
        NSCalendarsFullAccessUsageDescription: Plugins you approve for calendar access show your upcoming events and meeting links.
        NSCalendarsUsageDescription: Plugins you approve for calendar access show your upcoming events and meeting links.
        NSRemindersFullAccessUsageDescription: Plugins you approve for Reminders keep your to-dos there, so they reach your iPhone, iPad and Watch.
        NSRemindersUsageDescription: Plugins you approve for Reminders keep your to-dos there, so they reach your iPhone, iPad and Watch.
        NSAppleEventsUsageDescription: Plugins you approve can see the files you select in Finder, or control the apps they name, like Music.
        CFBundleShortVersionString: "0.36.0"
        CFBundleVersion: "0.36.0"
        LSUIElement: true
        # Sparkle. scripts/release.sh adds SUPublicEDKey; without it the app
        # never checks, so local and fork builds don't update from here.
        SUFeedURL: https://github.com/navbytes/stackbar/releases/latest/download/appcast.xml
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        LSMinimumSystemVersion: "26.0"
        # stackbar://commands/<plugin>/<command>?argument=value
        CFBundleURLTypes:
          - CFBundleURLName: io.navbytes.stackbar.commands
            CFBundleURLSchemes: [stackbar]
    # Not sandboxed: the host runs the Swift toolchain and launches plugin helpers, each in its own sandbox.
    entitlements:
      path: Packaging/Stackbar.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.application-groups: [59J9RQXYYP.io.navbytes.stackbar]
        # The hardened runtime denies calendar and reminders access,
        # without a prompt, unless the app carries this entitlement (Up Next
        # and Todo need it; there is no separate one for reminders).
        com.apple.security.personal-information.calendars: true
        # Finder's selection, for plugins granted .context; macOS asks once.
        com.apple.security.automation.apple-events: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.navbytes.stackbar
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Without its own scheme, `-scheme Stackbar` resolves to the package's Stackbar executable.
    scheme: {}
  StackbarWidget:
    type: app-extension
    platform: macOS
    sources: [Widget]
    dependencies:
      - package: Stackbar
        product: StackbarHostCore
      - package: Stackbar
        product: StackbarUI
    info:
      path: Packaging/Widget-Info.generated.plist
      properties:
        CFBundleShortVersionString: "0.36.0"
        CFBundleVersion: "0.36.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Packaging/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [59J9RQXYYP.io.navbytes.stackbar]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.navbytes.stackbar.widget

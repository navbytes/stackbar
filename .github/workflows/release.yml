name: Release

# Builds Stackbar.app on GitHub's macOS runner and publishes it to GitHub
# Releases. Run it from the Actions tab (it creates the tag) or push a v* tag.
#
# Signing: with the Developer ID secrets below the app is signed, notarized
# and stapled. Without them it is ad-hoc signed, which runs on any Mac after
# the Gatekeeper override in the release notes.
#   APPLE_CERT_P12          base64 of the "Developer ID Application" .p12
#   APPLE_CERT_PASSWORD     the .p12 password
#   APPLE_ID, APPLE_TEAM_ID, APPLE_NOTARY_PASSWORD   for notarytool

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark as a pre-release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HAS_CERT: ${{ secrets.APPLE_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_NOTARY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Version
        id: version
        run: |
          VERSION=$(sed -n 's/.*static let current = "\(.*\)".*/\1/p' Sources/StackbarHostCore/StackbarVersion.swift)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match StackbarVersion.current ($VERSION)"; exit 1
          fi

      - name: Import the Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.APPLE_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          [ -n "$IDENTITY" ] || { echo "::error::no Developer ID Application identity in APPLE_CERT_P12"; exit 1; }
          echo "STACKBAR_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          if [ "$HAS_NOTARY" = true ]; then
            xcrun notarytool store-credentials stackbar --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_NOTARY_PASSWORD" --keychain "$KEYCHAIN"
            echo "STACKBAR_NOTARY_PROFILE=stackbar" >> "$GITHUB_ENV"
            echo "NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: scripts/bundle.sh

      - name: Check the app
        run: |
          APP=build/Stackbar.app
          codesign --verify --strict --verbose=2 "$APP"
          "$APP/Contents/MacOS/stackbarctl" version
          [ -d "$APP/Contents/Resources/StackbarKit/Sources/StackbarKit" ]
          ls "$APP/Contents/Resources/StackbarKit/Bundles"
          shasum -a 256 build/Stackbar-*.zip | tee build/SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        run: |
          TAG="v$VERSION"
          if [ -n "${STACKBAR_NOTARY_PROFILE:-}" ]; then
            INSTALL="Signed with Developer ID and notarized: unzip, drag **Stackbar.app** into /Applications and open it."
          else
            INSTALL=$(cat <<'NOTES'
          **Test build, not notarized.** It is ad-hoc signed, so macOS blocks the first launch. To install:

          1. Unzip and drag **Stackbar.app** into /Applications.
          2. In Terminal: `xattr -dr com.apple.quarantine /Applications/Stackbar.app`
          3. Open Stackbar.

          Instead of step 2 you can open it once, then go to System Settings › Privacy & Security and click **Open Anyway**.
          NOTES
          )
          fi
          cat > build/notes.md <<NOTES
          $INSTALL

          Stackbar compiles plugins on your Mac, so it needs Xcode 26 or the Command Line Tools (\`xcode-select --install\`). Requires macOS 26.

          The command-line tool is inside the app: \`ln -sf /Applications/Stackbar.app/Contents/MacOS/stackbarctl ~/.local/bin/stackbarctl\`, then \`stackbarctl doctor\`.

          This build has no desktop widget (it is built with SwiftPM, not Xcode).

          Built from $(git rev-parse --short HEAD).
          NOTES
          FLAGS=""
          [ "$PRERELEASE" = true ] && FLAGS=--prerelease
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/Stackbar-"$VERSION".zip build/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file build/notes.md $FLAGS
          else
            gh release create "$TAG" build/Stackbar-"$VERSION".zip build/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title "Stackbar $VERSION" --notes-file build/notes.md $FLAGS
          fi

      - name: Remove the signing keychain
        if: always() && env.HAS_CERT == 'true'
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true

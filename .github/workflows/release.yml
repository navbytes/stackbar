name: Release

# Builds Stackbar.app on GitHub's macOS runner and publishes it to GitHub
# Releases. Run it from the Actions tab (it creates the tag) or push a v* tag.
#
# scripts/release.sh builds the Xcode project (app, widget, Sparkle, Sentry).
#
# Signing: with the Developer ID secrets below the app is signed, notarized
# and stapled. Without them it is ad-hoc signed, which runs on any Mac after
# the Gatekeeper override in the release notes.
#   APPLE_CERT_P12          base64 of the "Developer ID Application" .p12
#   APPLE_CERT_PASSWORD     the .p12 password
#   APPLE_ID, APPLE_TEAM_ID, APPLE_NOTARY_PASSWORD   for notarytool
#
# Homebrew: with HOMEBREW_TAP_TOKEN (a fine-grained PAT with contents and pull
# request write on navbytes/homebrew-tap) a notarized release also opens a PR
# there updating Casks/stackbar.rb. Without it the step is skipped.
#
# Updates: with SPARKLE_PRIVATE_KEY (a base64 Ed25519 seed) the app carries
# its public key and the release publishes a signed appcast.xml, which Sparkle
# reads from releases/latest. Without it the app doesn't update itself.
#
# Crash reports: SENTRY_DSN goes into the app; reports still need the user's
# yes. Without it the app has no crash reporting at all.
#
# Prebuilt helpers: each release then runs helpers.yml, which starts the
# Helpers workflow in navbytes/stackbar-plugins (needs PLUGINS_DISPATCH_TOKEN).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark as a pre-release (Sparkle and Homebrew users won't get it)
        type: boolean
        default: false
      dry_run:
        description: Build, sign and notarize only; keep the zip as a workflow artifact
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HAS_CERT: ${{ secrets.APPLE_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_NOTARY_PASSWORD != '' }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Version
        id: version
        run: |
          VERSION=$(sed -n 's/.*static let current = "\(.*\)".*/\1/p' Sources/StackbarHostCore/StackbarVersion.swift)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match StackbarVersion.current ($VERSION)"; exit 1
          fi
          grep -qE "^## $VERSION( |$)" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }

      - name: Import the Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.APPLE_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          [ -n "$IDENTITY" ] || { echo "::error::no Developer ID Application identity in APPLE_CERT_P12"; exit 1; }
          echo "STACKBAR_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          if [ "$HAS_NOTARY" = true ]; then
            xcrun notarytool store-credentials stackbar --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_NOTARY_PASSWORD" --keychain "$KEYCHAIN"
            echo "STACKBAR_NOTARY_PROFILE=stackbar" >> "$GITHUB_ENV"
            echo "NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          fi

      - name: Sparkle's public key
        if: env.HAS_SPARKLE_KEY == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: echo "SPARKLE_PUBLIC_KEY=$(swift scripts/ed25519.swift public-key)" >> "$GITHUB_ENV"

      - name: Build
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: scripts/release.sh

      - name: Check the app
        run: |
          APP=build/Stackbar.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          [ -d "$APP/Contents/PlugIns/StackbarWidget.appex" ]
          # The widget reads the plugin list from this group: both must claim it.
          GROUP=$(sed -n 's/.*static let appGroup = "\(.*\)".*/\1/p' Sources/StackbarHostCore/WidgetSnapshotStore.swift)
          for bundle in "$APP" "$APP/Contents/PlugIns/StackbarWidget.appex"; do
            codesign -d --entitlements - --xml "$bundle" 2>/dev/null | grep -q "<string>$GROUP</string>" \
              || { echo "::error::$bundle does not claim the app group $GROUP"; exit 1; }
          done
          [ -d "$APP/Contents/Frameworks/Sparkle.framework" ]
          if [ -n "${SPARKLE_PUBLIC_KEY:-}" ]; then
            [ "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$APP/Contents/Info.plist")" = "$SPARKLE_PUBLIC_KEY" ]
          fi
          if [ -n "${STACKBAR_NOTARY_PROFILE:-}" ]; then
            spctl --assess --type execute --verbose "$APP"
            xcrun stapler validate "$APP"
          fi
          "$APP/Contents/MacOS/stackbarctl" version
          [ -d "$APP/Contents/Resources/StackbarKit/Sources/StackbarKit" ]
          ls "$APP/Contents/Resources/StackbarKit/Bundles"
          (cd build && shasum -a 256 Stackbar-*.zip) | tee build/SHA256SUMS.txt

      - name: Appcast
        if: env.HAS_SPARKLE_KEY == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP="build/Stackbar-$VERSION.zip"
          SIGNATURE=$(swift scripts/ed25519.swift sign "$ZIP")
          python3 scripts/appcast.py write --zip "$ZIP" --version "$VERSION" --signature "$SIGNATURE" --out build/appcast.xml
          cat build/appcast.xml

      - name: Keep the dry run's build
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Stackbar-${{ steps.version.outputs.version }}
          path: |
            build/Stackbar-*.zip
            build/appcast.xml
          if-no-files-found: error

      - name: Publish
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        run: |
          TAG="v$VERSION"
          if [ -n "${STACKBAR_NOTARY_PROFILE:-}" ]; then
            INSTALL=$(cat <<'NOTES'
          Signed with Developer ID and notarized. Install with Homebrew or the one-line installer (both also put `stackbarctl` on your PATH):

          ```sh
          brew install --cask navbytes/tap/stackbar
          curl -fsSL https://stackbar.app/install.sh | bash
          ```

          Or unzip, drag **Stackbar.app** into /Applications and open it.
          NOTES
          )
          else
            INSTALL=$(cat <<'NOTES'
          **Test build, not notarized.** It is ad-hoc signed, so macOS blocks the first launch. To install:

          1. Unzip and drag **Stackbar.app** into /Applications.
          2. In Terminal: `xattr -dr com.apple.quarantine /Applications/Stackbar.app`
          3. Open Stackbar.

          Instead of step 2 you can open it once, then go to System Settings › Privacy & Security and click **Open Anyway**.
          NOTES
          )
          fi
          CHANGES=$(python3 scripts/appcast.py notes --version "$VERSION")
          cat > build/notes.md <<NOTES
          $CHANGES

          ## Install

          $INSTALL

          Requires macOS 26. Store plugins come prebuilt, so Xcode is not needed to use them. To write your own plugins, install Xcode 26 or the Command Line Tools (\`xcode-select --install\`).

          The command-line tool is inside the app: \`ln -sf /Applications/Stackbar.app/Contents/MacOS/stackbarctl ~/.local/bin/stackbarctl\`, then \`stackbarctl doctor\`.

          Built from $(git rev-parse --short HEAD).
          NOTES
          FLAGS=""
          [ "$PRERELEASE" = true ] && FLAGS=--prerelease
          set -- build/Stackbar-"$VERSION".zip build/SHA256SUMS.txt
          [ -f build/appcast.xml ] && set -- "$@" build/appcast.xml
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$@" --clobber
            gh release edit "$TAG" --notes-file build/notes.md $FLAGS
          else
            gh release create "$TAG" "$@" \
              --target "$GITHUB_SHA" --title "Stackbar $VERSION" --notes-file build/notes.md $FLAGS
          fi
          # The beta feed: every release, stable or pre-release, is the newest
          # version there, so the "beta" pre-release holds this release's
          # appcast. Stackbar reads it when "Get beta versions" is on.
          if [ -f build/appcast.xml ]; then
            if ! gh release view beta >/dev/null 2>&1; then
              gh release create beta --target "$GITHUB_SHA" --prerelease --title "Beta update feed" \
                --notes "Holds the appcast Stackbar reads when Settings › Store & Updates › Get beta versions is on. Download releases from the Releases page, not from here."
            fi
            gh release upload beta build/appcast.xml --clobber
          fi

      # Only notarized builds go to the tap: an ad-hoc one would not open.
      - name: Update the Homebrew cask (navbytes/homebrew-tap)
        if: env.DRY_RUN != 'true' && env.HOMEBREW_TAP_TOKEN != '' && env.STACKBAR_NOTARY_PROFILE != '' && !(github.event_name == 'workflow_dispatch' && inputs.prerelease)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: build/Stackbar-${{ steps.version.outputs.version }}.zip
          AUTO_UPDATES: ${{ env.HAS_SPARKLE_KEY }}
        run: scripts/update-homebrew-cask.sh

      - name: Remove the signing keychain
        if: always() && env.HAS_CERT == 'true'
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true

  # A helper must match the StackbarKit inside the app, so every release needs
  # a fresh set.
  helpers:
    needs: release
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    uses: ./.github/workflows/helpers.yml
    secrets:
      PLUGINS_DISPATCH_TOKEN: ${{ secrets.PLUGINS_DISPATCH_TOKEN }}

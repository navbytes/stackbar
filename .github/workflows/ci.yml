name: Stackbar

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: stackbar-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The plugin contract, the runtime and the supervisor are Foundation-only,
  # so the cheap Linux runner exercises all of them, including a real plugin
  # build through PluginBuilder.
  linux:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: swift build
      - run: swift test
        env:
          STACKBAR_BUILD_TESTS: '1'

  # macOS builds run only on a self-hosted runner on a developer's Mac, never on
  # GitHub's macOS runners (billed at about 10x Linux). The job is off until the
  # repository variable FLUID_MAC_RUNNER is "true", so nothing sits queued when
  # no Mac is online. scripts/mac-runner.sh sets the runner up. The variable and
  # the runner label `fluid` keep their pre-rename names so the runner already
  # registered on Naveen's Mac keeps working.
  macos:
    if: vars.FLUID_MAC_RUNNER == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: [self-hosted, macOS, fluid]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: scripts/check.sh

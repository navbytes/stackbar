name: Stackbar

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: stackbar-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The plugin contract, the runtime and the supervisor are Foundation-only,
  # so the cheap Linux runner exercises all of them, including a real plugin
  # build through PluginBuilder.
  linux:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: swift build
      - run: swift test
        env:
          STACKBAR_BUILD_TESTS: '1'

  # The app, StackbarUI and the widget only build on macOS. The
  # repository is public, so GitHub's macOS runners are free; nothing runs on
  # a developer's machine.
  macos:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: scripts/check.sh

name: Stackbar

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: stackbar-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which jobs this change needs (.github/scripts/changes.sh). A change that
  # only touches the site, docs or openspec skips the Swift jobs; a Linux-only
  # file like llms.txt skips the Macs. Manual runs, and pushes we can't diff,
  # run everything.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      linux: ${{ steps.decide.outputs.linux }}
      macos: ${{ steps.decide.outputs.macos }}
      xcode: ${{ steps.decide.outputs.xcode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            .github/scripts/changes.sh --all
          else
            git diff --name-only "$BASE...$HEAD" | tee /dev/stderr | .github/scripts/changes.sh
          fi | tee -a "$GITHUB_OUTPUT"
      # An organization's build settings belong in its own copy, never here
      # (docs/self-hosting.md).
      - name: No distribution override upstream
        if: github.repository == 'navbytes/stackbar'
        run: |
          if [ -e Packaging/distribution.override.json ]; then
            echo "::error::Packaging/distribution.override.json is for an organization's own copy; remove it"
            exit 1
          fi

  # The plugin contract, the runtime and the supervisor are Foundation-only,
  # so the cheap Linux runner exercises all of them, including a real plugin
  # build through PluginBuilder.
  linux:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    container: swift:6.2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: swift build
      - run: swift test
        env:
          STACKBAR_BUILD_TESTS: '1'

  # The app, StackbarUI and the widget only build on macOS. The
  # repository is public, so GitHub's macOS runners are free; nothing runs on
  # a developer's machine.
  macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: scripts/check.sh
      # The Release workflow signs the appcast with this script.
      - name: Sparkle signing script
        run: |
          export SPARKLE_PRIVATE_KEY=$(head -c 32 /dev/urandom | base64)
          echo hello > "$RUNNER_TEMP/archive"
          [ "$(swift scripts/ed25519.swift public-key | base64 --decode | wc -c | tr -d ' ')" = 32 ]
          [ "$(swift scripts/ed25519.swift sign "$RUNNER_TEMP/archive" | base64 --decode | wc -c | tr -d ' ')" = 64 ]

  # The real app, driven through a new user's first minute and through an
  # update from the latest release (scripts/app-check.sh). It fails on a
  # broken golden path or a blown speed budget; the screenshots, light and
  # dark, are in the app-check artifact.
  app:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: scripts/bundle.sh
      - run: scripts/app-check.sh --upgrade
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: app-check
          path: build/app-check

  # The Xcode build is the one that extracts App Intents metadata (Spotlight
  # and Shortcuts) and builds the widget; this checks both, unsigned.
  xcode:
    needs: changes
    if: needs.changes.outputs.xcode == 'true'
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: scripts/check-xcode.sh

  # One check that is green when every job that ran passed and the rest were
  # skipped on purpose. Make this the required status check, not the jobs
  # above, since a skipped job never reports.
  ok:
    name: CI ok
    if: always()
    needs: [changes, linux, macos, app, xcode]
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac

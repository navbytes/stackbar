name: Site

# Builds stackbar.navbytes.io (site/) and deploys it to GitHub Pages from main.
# Plugin pages come from the published store, so the site also rebuilds daily
# and when navbytes/stackbar-plugins publishes (repository_dispatch).
on:
  push:
    branches: [main]
    paths: [site/**, Sources/StackbarKit/Design.swift, Sources/StackbarHostCore/OfficialIndex.swift, Sources/StackbarHostCore/StackbarVersion.swift, Packaging/Icon/**, Examples/ClockPlugin/**, .github/workflows/site.yml]
  pull_request:
    paths: [site/**, Sources/StackbarKit/Design.swift, Sources/StackbarHostCore/OfficialIndex.swift, Sources/StackbarHostCore/StackbarVersion.swift, Packaging/Icon/**, Examples/ClockPlugin/**, .github/workflows/site.yml]
  schedule:
    - cron: '17 6 * * *'
  repository_dispatch:
    types: [store-published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  # Repository variables, set once stackbar.navbytes.io points here.
  SITE_URL: ${{ vars.SITE_URL || 'https://navbytes.github.io' }}
  SITE_BASE: ${{ vars.SITE_BASE || '/stackbar' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run links
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: Sync from upstream

# For an organization's private copy of Stackbar (docs/self-hosting.md). Once a
# day, merges the upstream repository's main into a sync/upstream branch and
# opens or refreshes a pull request, so the copy's own review and CI gate it.
# Merge that pull request with a merge commit, never squash or rebase: the
# plugins repository pins StackbarKit by upstream commit, and the copy must
# keep those commits.
#
# Does nothing unless vars.UPSTREAM_REPO is set (for example navbytes/stackbar),
# so it never runs in navbytes/stackbar itself. Needs SYNC_TOKEN, a
# fine-grained PAT with contents, pull requests and workflows write on this
# repository: GITHUB_TOKEN can't push changes to workflow files, and pull
# requests it opens don't start CI.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-upstream

jobs:
  sync:
    if: vars.UPSTREAM_REPO != '' && vars.UPSTREAM_REPO != github.repository
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO }}
      GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
    steps:
      - name: Token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SYNC_TOKEN is not set (contents, pull requests and workflows write on this repository)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}
      - name: Merge upstream main
        id: merge
        run: |
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Up to date with $UPSTREAM_REPO."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B sync/upstream
          if ! git merge --no-ff --no-edit -m "Merge $UPSTREAM_REPO main" upstream/main; then
            git merge --abort
            echo "::error::Merging $UPSTREAM_REPO main conflicts with this copy. Merge it by hand (git fetch upstream && git merge upstream/main); conflicts mean an upstream file was edited here, which docs/self-hosting.md says to avoid."
            exit 1
          fi
          git push --force origin sync/upstream
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "upstream=$(git rev-parse --short upstream/main)" >> "$GITHUB_OUTPUT"
      - name: Pull request
        if: steps.merge.outputs.changed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream }}
        run: |
          BODY="Merges $UPSTREAM_REPO main ($UPSTREAM_SHA). Merge with **Create a merge commit**: squashing or rebasing drops the upstream commits this copy's plugins pin."
          if [ "$(gh pr list --head sync/upstream --state open --json number --jq length)" = 0 ]; then
            gh pr create --head sync/upstream --base "${{ github.event.repository.default_branch }}" \
              --title "Sync from $UPSTREAM_REPO" --body "$BODY"
          else
            gh pr edit sync/upstream --body "$BODY"
          fi
